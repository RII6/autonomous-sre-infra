global:
  scrape_interval: 5s 

# Подключение правил алертов
rule_files:
  - 'alert-rules.yml'

# Подключение к Alertmanager
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # 3. Метрики Docker-контейнеров (cAdvisor)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # 4. Наш FastAPI бэкенд (поддерживает динамическое масштабирование)
  - job_name: 'sre-backend'
    dns_sd_configs:
      - names: ['app']
        type: 'A'
        port: 8000
