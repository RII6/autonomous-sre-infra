version: '3.8'

services:
  app:
    build: ./app
    restart: unless-stopped 
    networks:
      - defense_net 
    deploy:
      resources:
        limits:
          memory: 256M  

  sre_agent:
    container_name: sre_agent
    build: ./sre_agent
    ports:
      - "8001:8001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/project
    networks:
      - defense_net
    restart: unless-stopped

  nginx:
    container_name: sre_proxy
    image: nginx:1.25-alpine
    ports:
      - "80:80" 
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
      - sre_agent
    networks:
      - defense_net
    restart: unless-stopped

  # ----------------------------------------------------
  # БЛОК ОБЗЕРВАБИЛИТИ (МОНИТОРИНГ)
  # ----------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: sre_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert-rules.yml:/prometheus/alert-rules.yml:ro
    networks:
      - defense_net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.1.0
    container_name: sre_grafana
    ports:
      - "3000:3000"
    networks:
      - defense_net
    depends_on:
      - prometheus
    restart: unless-stopped
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning

  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: sre_alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - defense_net
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: sre_node_exporter
    pid: host
    volumes:
      - /:/rootfs:ro
    command:
      - '--path.rootfs=/rootfs'
    networks:
      - defense_net
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: sre_cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - defense_net
    restart: unless-stopped

  # ----------------------------------------------------
  # БЛОК ИММУННОЙ СИСТЕМЫ (HONEYPOT)
  # ----------------------------------------------------
  honeypot:
    container_name: sre_honeypot
    build: ./honeypot
    ports:
      - "2222:2222"
    networks:
      - defense_net
    restart: unless-stopped

networks:
  defense_net:
    driver: bridge                   
    name: sre_defense_net
