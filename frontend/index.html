<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <title>SRE Control Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-white font-sans p-8">
  <div class="max-w-4xl mx-auto">
    <header class="flex justify-between items-center mb-8 border-b border-gray-700 pb-4">
      <h1 class="text-2xl font-bold text-emerald-400">🛡️ SRE Chaos & Defense Center</h1>
      <span id="sys-status" class="px-3 py-1 bg-emerald-900 text-emerald-300 rounded-full text-sm">System: Online</span>
    </header>

    <!-- Метрики в реальном времени -->
    <div class="grid grid-cols-4 gap-4 mb-8">
      <div class="bg-gray-800 p-4 rounded-lg border border-gray-700">
        <p class="text-gray-400 text-sm">CPU Load</p>
        <p id="cpu-metric" class="text-2xl font-bold text-blue-400">--%</p>
      </div>
      <div class="bg-gray-800 p-4 rounded-lg border border-gray-700">
        <p class="text-gray-400 text-sm">Memory</p>
        <p id="mem-metric" class="text-2xl font-bold text-blue-400">--%</p>
      </div>
      <div class="bg-gray-800 p-4 rounded-lg border border-gray-700">
        <p class="text-gray-400 text-sm">Connections</p>
        <p id="conn-metric" class="text-2xl font-bold text-purple-400">--</p>
      </div>
      <div class="bg-gray-800 p-4 rounded-lg border border-gray-700">
        <p class="text-gray-400 text-sm">Blocked Threats</p>
        <p id="threat-metric" class="text-2xl font-bold text-red-400">--</p>
      </div>
    </div>

    <!-- Панель симуляции атак -->
    <div class="bg-gray-800 p-6 rounded-lg border border-gray-700 mb-8">
      <h2 class="text-lg font-semibold mb-4 text-yellow-400">⚡ Панель симуляции (Chaos Engineering)</h2>
      <div class="flex gap-4">
        <button onclick="triggerAttack('ddos')"
          class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded font-medium transition">Запустить DDoS</button>
        <button onclick="triggerAttack('bruteforce')"
          class="bg-orange-600 hover:bg-orange-700 px-4 py-2 rounded font-medium transition">Брутфорс SSH</button>
        <button onclick="triggerAttack('kill-node')"
          class="bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded font-medium transition">Убить контейнер</button>
      </div>
      <p id="action-response" class="mt-4 text-sm text-gray-400 italic">Ожидание действий...</p>
    </div>
  </div>

  <script>
    const API_URL = "http://localhost:8000";

    async function fetchMetrics() {
      try {
        const res = await fetch(`${API_URL}/api/metrics`);
        const data = await res.json();
        document.getElementById('cpu-metric').innerText = data.cpu_usage + '%';
        document.getElementById('mem-metric').innerText = data.memory_usage + '%';
        document.getElementById('conn-metric').innerText = data.active_connections;
        document.getElementById('threat-metric').innerText = data.threats_blocked;
      } catch (e) {
        document.getElementById('sys-status').className = "px-3 py-1 bg-red-900 text-red-300 rounded-full text-sm";
        document.getElementById('sys-status').innerText = "System: Offline";
      }
    }

    async function triggerAttack(type) {
      const res = await fetch(`${API_URL}/api/simulate/attack?attack_type=${type}`, { method: 'POST' });
      const data = await res.json();
      document.getElementById('action-response').innerText = `[LOG] ${data.message} -> ${data.action_taken}`;
    }

    setInterval(fetchMetrics, 2000);
    fetchMetrics();
  </script>
</body>

</html>
